<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Gestor de Gastos</title>
  <meta name="description" content="Gestor de gastos personal y de negocio. Funciona offline y guarda los datos solo en tu teléfono.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171b20" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body data-ambito="personal">
  <a class="skip" href="#view">Saltar al contenido</a>

  <header class="appbar">
    <h1 class="appbar-title">Gastos</h1>
    <div class="ambito-switch" role="group" aria-label="Ámbito">
      <button type="button" data-ambito="personal" aria-pressed="true">Personal</button>
      <button type="button" data-ambito="negocio" aria-pressed="false">Negocio</button>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <p class="loading">Cargando…</p>
  </main>

  <button id="fab" class="fab" type="button" aria-label="Cargar movimiento" hidden>+</button>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#/movimientos" data-route="movimientos"><span class="tab-icon" aria-hidden="true">📋</span><span>Movimientos</span></a>
    <a href="#/resumen" data-route="resumen"><span class="tab-icon" aria-hidden="true">📊</span><span>Resumen</span></a>
    <a href="#/presupuestos" data-route="presupuestos"><span class="tab-icon" aria-hidden="true">🎯</span><span>Presupuestos</span></a>
    <a href="#/ajustes" data-route="ajustes"><span class="tab-icon" aria-hidden="true">⚙️</span><span>Ajustes</span></a>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p class="card">Esta app necesita JavaScript activado.</p></noscript>
</body>
</html>
